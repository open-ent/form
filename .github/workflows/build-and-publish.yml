name: Build & Publish Fat Mods

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
      - '*-patched'
      - '*-patched-dev'
    tags: ['*']
  pull_request:
    branches: [main, master, develop, dev]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build & Publish Fat Mods (formulaire + formulaire-public)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
          cache: maven

      # --- Angular legacy frontends (gulp/webpack/yarn via pinned docker image) ---
      - name: Build Angular frontend (formulaire)
        working-directory: formulaire/angular
        run: |
          docker run --rm \
            -v "$PWD:/home/node/app" \
            -v "$PWD/../../common:/home/node/app/common" \
            -w /home/node/app --user root \
            opendigitaleducation/node:20-alpine-pnpm \
            sh -c '
              export COREPACK_ENABLE_STRICT=0
              /usr/local/bin/yarn install --ignore-engines --network-timeout 600000
              node_modules/gulp/bin/gulp.js build
              npx -y sass@1.77.8 --load-path=node_modules/ --no-source-map src/sass/index.scss src/css/formulaire.css
            '

      - name: Build Angular frontend (formulaire-public)
        working-directory: formulaire-public/angular
        run: |
          docker run --rm \
            -v "$PWD:/home/node/app" \
            -v "$PWD/../../common:/home/node/app/common" \
            -w /home/node/app --user root \
            opendigitaleducation/node:20-alpine-pnpm \
            sh -c '
              export COREPACK_ENABLE_STRICT=0
              /usr/local/bin/yarn install --ignore-engines --network-timeout 600000
              node_modules/gulp/bin/gulp.js build
            '

      # --- React frontends (pnpm / Vite) ---
      - name: Build React frontend (formulaire)
        working-directory: formulaire/frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Build React frontend (formulaire-public)
        working-directory: formulaire-public/frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.OPENENT_PACKAGES_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TIPTAP_PRO_TOKEN: ${{ secrets.TIPTAP_PRO_TOKEN }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      # --- Inject static content into each backend (mirrors build.sh) ---
      - name: Inject frontends into formulaire backend
        run: |
          set -eu
          RES=formulaire/backend/src/main/resources
          rm -rf $RES/public/css $RES/public/img $RES/public/js \
                 $RES/public/mdi $RES/public/template $RES/view
          mkdir -p $RES/public/css $RES/public/img $RES/public/js \
                   $RES/public/mdi $RES/public/template $RES/view
          # AngularJS static
          cp -R formulaire/angular/src/css/*       $RES/public/css/
          cp -R formulaire/angular/src/img/*       $RES/public/img/
          cp -R formulaire/angular/src/dist/*      $RES/public/js/
          cp -R formulaire/angular/src/mdi/*       $RES/public/mdi/
          cp -R formulaire/angular/src/template/*  $RES/public/template/
          cp -R formulaire/angular/src/view/*      $RES/view/
          # .html files from ts folder (preserving tree)
          ( cd formulaire/angular/src/ts && shopt -s globstar && \
            rsync -R **/*.html ../../../backend/src/main/resources/public/ts --relative --no-implied-dirs ) || true
          # React static
          cp -R formulaire/frontend/dist/public/*  $RES/public/
          cp -R formulaire/frontend/dist/img/*     $RES/public/img/
          cp    formulaire/frontend/dist/index.html $RES/view/index.html

      - name: Inject frontends into formulaire-public backend
        run: |
          set -eu
          RES=formulaire-public/backend/src/main/resources
          rm -rf $RES/public/img $RES/public/js \
                 $RES/public/mdi $RES/public/template $RES/view
          mkdir -p $RES/public/img $RES/public/js \
                   $RES/public/mdi $RES/public/template $RES/view
          # AngularJS static (no css for public)
          cp -R formulaire-public/angular/src/img/*       $RES/public/img/
          cp -R formulaire-public/angular/src/dist/*      $RES/public/js/
          [ -d formulaire-public/angular/src/mdi ]      && cp -R formulaire-public/angular/src/mdi/*      $RES/public/mdi/      || true
          [ -d formulaire-public/angular/src/template ] && cp -R formulaire-public/angular/src/template/* $RES/public/template/ || true
          [ -d formulaire-public/angular/src/view ]     && cp -R formulaire-public/angular/src/view/*     $RES/view/            || true
          ( cd formulaire-public/angular/src/ts && shopt -s globstar && \
            rsync -R **/*.html ../../../backend/src/main/resources/public/ts --relative --no-implied-dirs ) || true
          # React static
          cp -R formulaire-public/frontend/dist/public/*  $RES/public/
          cp -R formulaire-public/frontend/dist/img/*     $RES/public/img/ 2>/dev/null || true
          cp    formulaire-public/frontend/dist/index.html $RES/view/index.html

      # --- Maven build (reactor : common + formulaire + formulaire-public) ---
      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Build all fat JARs
        run: mvn clean package -DskipTests -B -DbuildNumber=${GITHUB_SHA::8} -DscmBranch=${GITHUB_REF_NAME}

      - name: Run tests
        if: github.event_name == 'pull_request'
        run: mvn test -B

      - name: Publish all fat JARs to GitHub Packages
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://maven.pkg.github.com/${{ github.repository }}"
          for FAT in $(find . -path "*/target/*-fat.jar"); do
            BASE=$(basename "${FAT}" -fat.jar)
            case "${BASE}" in *~*~*) ;; *) echo "skip ${BASE}"; continue;; esac
            FAT_ABS=$(realpath "${FAT}")
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            echo "Publishing ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> GitHub Packages"
            ( cd /tmp && mvn deploy:deploy-file -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=github -Durl="${REPO_URL}" -B ) || true
          done

      - name: Publish all fat JARs to rct-nexus
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          cat > /tmp/nx-settings.xml <<EOF
          <settings><servers><server><id>pt-releases</id><username>${NEXUS_USER}</username><password>${NEXUS_PASSWORD}</password></server></servers></settings>
          EOF
          for FAT in $(find . -path "*/target/*-fat.jar"); do
            BASE=$(basename "${FAT}" -fat.jar)
            case "${BASE}" in *~*~*) ;; *) echo "skip ${BASE}"; continue;; esac
            FAT_ABS=$(realpath "${FAT}")
            GROUP_ID=${BASE%%~*}; REST=${BASE#*~}; ARTIFACT_ID=${REST%%~*}; VERSION=${REST#*~}
            echo "Deploying ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}:fat -> rct-nexus"
            ( cd /tmp && mvn deploy:deploy-file -s /tmp/nx-settings.xml -Dfile="${FAT_ABS}" -DgroupId="${GROUP_ID}" -DartifactId="${ARTIFACT_ID}" -Dversion="${VERSION}" -Dclassifier=fat -Dpackaging=jar -DrepositoryId=pt-releases -Durl="https://rct-nexus.tech.fr/repository/maven-releases/" -B )
          done

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            formulaire/backend/target/*-fat.jar
            formulaire-public/backend/target/*-fat.jar
          generate_release_notes: true
